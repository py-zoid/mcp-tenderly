name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: nothing in this workflow needs write access to anything.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and current. A break on
        # only one of the two is nearly always an accidental syntax-level
        # dependency on the newer runtime.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: .github/scripts/verify.sh
